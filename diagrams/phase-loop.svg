<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" font-family="Helvetica, Arial, sans-serif">
  <title>Phase loop: the repeating way to work one phase</title>
  <desc>Eight steps arranged in a clockwise cycle: 1 read the terms in the glossary, 2 re-verify the tools, 3 learn rows each pinned to an exercise, 4 build and grow the platform through PRs, 5 prove-it assignment, 6 build the satellite, 7 pass the gate and tick PROGRESS, 8 publish one post, then back to step 1 for the next phase.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="700" fill="#FFFFFF"/>

  <!-- cycle arrows: elliptical arcs clockwise on ellipse rx=330 ry=265 centered (450,360) -->
  <g stroke="#666666" stroke-width="2" fill="none">
    <path d="M 546 107 A 330 265 0 0 1 600 124" marker-end="url(#arr)"/>
    <path d="M 744 240 A 330 265 0 0 1 776 321" marker-end="url(#arr)"/>
    <path d="M 776 399 A 330 265 0 0 1 744 480" marker-end="url(#arr)"/>
    <path d="M 600 596 A 330 265 0 0 1 546 613" marker-end="url(#arr)"/>
    <path d="M 354 613 A 330 265 0 0 1 300 596" marker-end="url(#arr)"/>
    <path d="M 156 480 A 330 265 0 0 1 124 399" marker-end="url(#arr)"/>
    <path d="M 124 321 A 330 265 0 0 1 156 240" marker-end="url(#arr)"/>
    <path d="M 300 124 A 330 265 0 0 1 354 107" marker-end="url(#arr)"/>
  </g>
  <text x="316" y="88" text-anchor="middle" font-size="12" font-style="italic" fill="#444444">next phase →</text>

  <!-- node 1: top (450,95) -->
  <g>
    <rect x="365" y="65" width="170" height="60" rx="10" fill="#F5F5F5" stroke="#666666" stroke-width="1.5"/>
    <text x="450" y="92" text-anchor="middle" font-size="13" fill="#333333">Read the terms</text>
    <text x="450" y="108" text-anchor="middle" font-size="13" fill="#333333">(GLOSSARY)</text>
    <circle cx="368" cy="68" r="13" fill="#666666"/>
    <text x="368" y="72.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">1</text>
  </g>

  <!-- node 2: top-right (683,173) -->
  <g>
    <rect x="598" y="143" width="170" height="60" rx="10" fill="#F5F5F5" stroke="#666666" stroke-width="1.5"/>
    <text x="683" y="177" text-anchor="middle" font-size="13" fill="#333333">Re-verify the tools</text>
    <circle cx="601" cy="146" r="13" fill="#666666"/>
    <text x="601" y="150.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">2</text>
  </g>

  <!-- node 3: right (780,360) -->
  <g>
    <rect x="695" y="330" width="170" height="60" rx="10" fill="#F5F5F5" stroke="#666666" stroke-width="1.5"/>
    <text x="780" y="357" text-anchor="middle" font-size="13" fill="#333333">Learn rows — each</text>
    <text x="780" y="373" text-anchor="middle" font-size="13" fill="#333333">pinned to an exercise</text>
    <circle cx="698" cy="333" r="13" fill="#666666"/>
    <text x="698" y="337.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">3</text>
  </g>

  <!-- node 4: bottom-right (683,547) -->
  <g>
    <rect x="598" y="517" width="170" height="60" rx="10" fill="#F5F5F5" stroke="#666666" stroke-width="1.5"/>
    <text x="683" y="544" text-anchor="middle" font-size="13" fill="#333333">Build: grow the</text>
    <text x="683" y="560" text-anchor="middle" font-size="13" fill="#333333">platform (PRs)</text>
    <circle cx="601" cy="520" r="13" fill="#666666"/>
    <text x="601" y="524.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">4</text>
  </g>

  <!-- node 5: bottom (450,625) -->
  <g>
    <rect x="365" y="595" width="170" height="60" rx="10" fill="#F5F5F5" stroke="#666666" stroke-width="1.5"/>
    <text x="450" y="629" text-anchor="middle" font-size="13" fill="#333333">Prove-it assignment</text>
    <circle cx="368" cy="598" r="13" fill="#666666"/>
    <text x="368" y="602.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">5</text>
  </g>

  <!-- node 6: bottom-left (217,547) -->
  <g>
    <rect x="132" y="517" width="170" height="60" rx="10" fill="#F5F5F5" stroke="#666666" stroke-width="1.5"/>
    <text x="217" y="551" text-anchor="middle" font-size="13" fill="#333333">Build the satellite</text>
    <circle cx="135" cy="520" r="13" fill="#666666"/>
    <text x="135" y="524.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">6</text>
  </g>

  <!-- node 7: left (120,360) — the gate, accent -->
  <g>
    <rect x="35" y="330" width="170" height="60" rx="10" fill="#1a73a7"/>
    <text x="120" y="357" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">Pass the gate</text>
    <text x="120" y="373" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">+ tick PROGRESS</text>
    <circle cx="38" cy="333" r="13" fill="#666666"/>
    <text x="38" y="337.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">7</text>
  </g>

  <!-- node 8: top-left (217,173) -->
  <g>
    <rect x="132" y="143" width="170" height="60" rx="10" fill="#F5F5F5" stroke="#666666" stroke-width="1.5"/>
    <text x="217" y="177" text-anchor="middle" font-size="13" fill="#333333">Publish one post</text>
    <circle cx="135" cy="146" r="13" fill="#666666"/>
    <text x="135" y="150.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">8</text>
  </g>
</svg>
