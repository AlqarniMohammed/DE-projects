    <text x="290" y="423" text-anchor="middle" font-size="12" fill="#333333">Platform v2: Airflow 3 ·</text>
    <text x="290" y="439" text-anchor="middle" font-size="12" fill="#333333">dlt · CDC · Kinesis</text>
    <text x="290" y="474" text-anchor="middle" font-size="12" fill="#555555">Satellites: Redshift hybrid ·</text>
    <text x="290" y="490" text-anchor="middle" font-size="12" fill="#555555">Dagster comparison</text>
