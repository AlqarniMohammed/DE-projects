    <rect x="320" y="50" width="230" height="150" rx="10" fill="none" stroke="#666666" stroke-width="1.5"/>
    <text x="435" y="71" text-anchor="middle" font-size="13" font-weight="bold" fill="#222222">P1 · Foundations</text>
    <text x="435" y="89" text-anchor="middle" font-size="12" fill="#444444">Months 1–2</text>
    <text x="435" y="123" text-anchor="middle" font-size="12" fill="#333333">Platform v0.1: local lakehouse</text>
    <text x="435" y="139" text-anchor="middle" font-size="12" fill="#333333">(DuckDB · Iceberg · dbt)</text>
    <text x="435" y="182" text-anchor="middle" font-size="12" fill="#555555">Satellite: first dbt project</text>
