<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="Helvetica, Arial, sans-serif">
  <title>Route map: the 7-phase data engineering journey, P0 to P6</title>
  <desc>Two rows of phase cards read left to right. Top row: P0 Orientation, P1 Foundations, P2 AWS Lakehouse Core, P3 Spark and Databricks. A connector turns down from P3 to the bottom row: P4 Orchestration and Ingestion, P5 Streaming and CDC, P6 Production, Serving and Capstone. Each card shows the platform milestone and satellite projects, with a gate pill G0 to G6 below it. G2 and G3 are certification gates.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="620" fill="#FFFFFF"/>

  <!-- ================= P0 card (x=30, y=50) ================= -->
  <g>
    <rect x="30" y="50" width="230" height="150" rx="10" fill="#F5F5F5"/>
    <path d="M 30 100 L 30 60 Q 30 50 40 50 L 250 50 Q 260 50 260 60 L 260 100 Z" fill="#E0E0E0"/>
    <path d="M 30 156 L 260 156 L 260 190 Q 260 200 250 200 L 40 200 Q 30 200 30 190 Z" fill="#EBEBEB"/>
    <line x1="30" y1="100" x2="260" y2="100" stroke="#999999" stroke-width="1"/>
    <line x1="30" y1="156" x2="260" y2="156" stroke="#999999" stroke-width="1"/>
    <rect x="30" y="50" width="230" height="150" rx="10" fill="none" stroke="#666666" stroke-width="1.5"/>
    <text x="145" y="71" text-anchor="middle" font-size="13" font-weight="bold" fill="#222222">P0 · Orientation &amp; Setup</text>
    <text x="145" y="89" text-anchor="middle" font-size="12" fill="#444444">~2 weeks</text>
    <text x="145" y="123" text-anchor="middle" font-size="12" fill="#333333">Setup only — toolchain</text>
    <text x="145" y="139" text-anchor="middle" font-size="12" fill="#333333">+ safe AWS account</text>
    <text x="145" y="182" text-anchor="middle" font-size="12" fill="#555555">—</text>
    <line x1="145" y1="200" x2="145" y2="212" stroke="#666666" stroke-width="1.5"/>
    <rect x="117" y="212" width="56" height="28" rx="14" fill="#EBEBEB" stroke="#666666" stroke-width="1.5"/>
    <text x="145" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#333333">G0</text>
  </g>

  <!-- ================= P1 card (x=320, y=50) ================= -->
  <g>
    <rect x="320" y="50" width="230" height="150" rx="10" fill="#F5F5F5"/>
