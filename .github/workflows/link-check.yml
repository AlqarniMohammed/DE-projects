name: Link check

# Link rot is certain across a year of deep external links (course pages,
# exam-guide PDFs). This catches dead links before a phase starts — and
# dogfoods CI on the repo that preaches it.
# sources/ is excluded: it's the frozen research bibliography (citations
# as of the research date); rot there is expected and not actionable.

on:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --accept 200,201,202,203,204,206,301,302,303,304,307,308,403,429,999
            --max-concurrency 8
            --exclude-path LICENSE
            --exclude-path sources
            './**/*.md'
          fail: true
