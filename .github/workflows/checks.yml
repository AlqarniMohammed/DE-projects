name: Checks

on:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install pytest
      - name: Glossary format guard
        run: python tools/glossary_check.py GLOSSARY.md
      - name: Run test suite
        run: pytest tests/ -q
